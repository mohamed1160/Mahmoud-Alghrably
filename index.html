<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg-primary:#12100e;--bg-secondary:#1a1714;--bg-tertiary:#25201b;--bg-card:rgba(26,23,20,.82);--accent:#c59b6d;--accent-soft:rgba(197,155,109,.14);--text:#efe6da;--muted:#a89c8d;--line:rgba(239,230,218,.1);--r:16px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:var(--bg-primary);color-scheme:dark}
body{background:var(--bg-primary);color:var(--text);font:400 16px/1.7 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:var(--sab);overflow-x:hidden}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.15;letter-spacing:-.01em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .brand{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;letter-spacing:0;line-height:1.35}
a{color:inherit;text-decoration:none}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
section.alt{background:var(--bg-secondary)}
header{position:fixed;top:0;inset-inline:0;z-index:20;padding-top:var(--sat);background:rgba(18,16,14,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;white-space:nowrap}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#1a1209;display:grid;place-items:center;font:800 .95rem "Bricolage Grotesque",sans-serif}
.brand i{font-style:normal;color:var(--accent)}
nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
nav a{padding:8px 12px;border-radius:9px;color:var(--muted);font-size:.92rem;white-space:nowrap}
nav a:hover{color:var(--text);background:var(--bg-tertiary)}
.lang{border:1px solid var(--line);background:var(--bg-tertiary);color:var(--text);border-radius:999px;padding:7px 15px;font:500 .88rem inherit;cursor:pointer;white-space:nowrap}
.lang:hover{border-color:var(--accent)}
.hero{padding-top:calc(150px + var(--sat));padding-bottom:90px;background:radial-gradient(900px 480px at 80% 10%,rgba(197,155,109,.12),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg-card);border-radius:999px;padding:7px 16px;font-size:.88rem;color:var(--muted)}
.badge b{width:8px;height:8px;border-radius:50%;background:#7fbf8e;animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.hello{margin-top:28px;color:var(--muted);font-size:1.15rem}
h1{font-size:clamp(1.6rem,6vw,2.8rem);font-weight:800;margin:4px 0 14px;white-space:nowrap}
.role{font-size:1.3rem;color:var(--accent);font-weight:500}
.tag{margin:20px 0 14px;font-size:1.15rem;font-style:italic;color:var(--text)}
.intro{color:var(--muted);max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:12px;font-weight:500;border:1px solid var(--line);cursor:pointer;font-family:inherit;font-size:1rem;color:var(--text);background:transparent}
.btn.p{background:var(--accent);color:#1a1209;border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.08)}
.btn:not(.p):hover{border-color:var(--accent);background:var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);background:var(--bg-secondary);border:1px solid var(--line);padding:7px 14px;border-radius:999px}
.pill .ic{color:var(--accent)}
.photo{position:relative;max-width:420px;justify-self:center;width:100%}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;border:1px solid var(--line);display:block;background:var(--bg-tertiary)}
.photo:before{content:"";position:absolute;inset:18px -18px -18px 18px;border:1px solid var(--accent);border-radius:28px;opacity:.45;z-index:-1}
[dir=rtl] .photo:before{inset:18px 18px -18px -18px}
.float{position:absolute;display:flex;gap:12px;align-items:center;background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.float .ic{color:var(--accent);width:1.5em;height:1.5em}
.float b{display:block;font-size:.95rem;line-height:1.3}.float small{color:var(--muted);font-size:.78rem;line-height:1.3;display:block}
.f0{inset-inline-start:-34px;bottom:46px}.f1{inset-inline-end:-24px;top:34px}
.head{max-width:720px;margin-bottom:48px}
.sub{color:var(--accent);font-size:.95rem;font-weight:500;margin-bottom:8px}
h2{font-size:clamp(2rem,4vw,3rem);font-weight:800}
.lead{color:var(--muted);margin-top:14px}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px}
.idcard{text-align:center;position:sticky;top:96px;align-self:start}
.idcard .mark{width:84px;height:84px;font-size:1.8rem;margin:0 auto 16px;border-radius:24px}
.idcard h3{font-size:1.3rem}.idcard p{color:var(--muted);font-size:.92rem;margin-top:4px}
.snaps{display:grid;gap:12px;margin-top:22px;text-align:start}
.snap{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--bg-tertiary)}
.snap .ic{color:var(--accent);margin-top:4px}.snap b{display:block;font-size:.95rem}.snap small{color:var(--muted)}
.about h3.big{font-size:1.55rem;font-weight:700;margin-bottom:18px;line-height:1.4}
.about p{color:var(--muted);margin-bottom:14px}
.about h4{margin:26px 0 12px;font-size:1rem}
ul.focus{list-style:none;padding:0;display:grid;gap:8px}
ul.focus li{display:flex;gap:10px;align-items:center}ul.focus .ic{color:var(--accent)}
blockquote{margin:28px 0;padding:20px 24px;border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:1.05rem}
[dir=rtl] blockquote{border-radius:12px 0 0 12px}
blockquote small{display:block;color:var(--accent);font-weight:500;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;font-size:.88rem;background:var(--bg-tertiary);border:1px solid var(--line);color:var(--text)}
.chip.hi{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.grow{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.sk h3{display:flex;gap:12px;align-items:center;font-size:1.1rem;margin-bottom:16px}
.sk h3 .ic{color:var(--accent);width:1.5em;height:1.5em}
.sk p{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.proj{display:grid;grid-template-columns:1fr;gap:0;overflow:hidden;padding:0}
.proj img{width:100%;height:auto;max-height:480px;object-fit:contain;background:#fff;display:block}
.proj .body{padding:34px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-bottom:12px}
.meta em{font-style:normal;color:#7fbf8e}
.proj h3{font-size:1.7rem;margin-bottom:10px}.proj .body>p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.stat{background:var(--bg-tertiary);border-radius:12px;padding:14px 16px}
.stat b{font:800 1.5rem "Bricolage Grotesque",sans-serif;color:var(--accent);display:block;line-height:1.2}.stat small{color:var(--muted);font-size:.82rem}
.proj h4{font-size:.95rem;margin:18px 0 10px}
.insight{margin-top:22px;padding:16px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent-soft);font-size:.95rem}
.insight b,.learn b{color:var(--accent)}.learn{margin-top:14px;color:var(--muted);font-size:.95rem}
.tl{position:relative;display:grid;gap:22px;padding-inline-start:34px}
.tl:before{content:"";position:absolute;inset-block:8px;inset-inline-start:7px;width:2px;background:var(--line)}
.tl .card{position:relative}
.tl .card:before{content:"";position:absolute;top:30px;inset-inline-start:-34px;width:16px;height:16px;border-radius:50%;background:var(--bg-primary);border:3px solid var(--muted)}
.tl .card.on:before{border-color:var(--accent);background:var(--accent)}
.tl .bd{display:inline-block;font-size:.82rem;color:var(--accent);background:var(--accent-soft);padding:3px 12px;border-radius:999px;margin-bottom:12px}
.tl h3{font-size:1.25rem}.tl .org{color:var(--accent);margin:2px 0 10px;font-weight:500}.tl p{color:var(--muted);margin-bottom:10px;font-size:.95rem}
.svc .ic{color:var(--accent);width:2em;height:2em;margin-bottom:14px}.svc h3{font-size:1.15rem;margin-bottom:8px}.svc>p{color:var(--muted);font-size:.93rem;margin-bottom:14px}
.svc ul{list-style:none;padding:0;display:grid;gap:6px;font-size:.9rem}.svc li{padding-inline-start:20px;position:relative}.svc li:before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:8px;height:2px;background:var(--accent)}
.obj{text-align:center;max-width:860px;margin:0 auto 44px}
.obj q{display:block;font:500 clamp(1.25rem,2.4vw,1.7rem)/1.6 "Bricolage Grotesque","IBM Plex Sans Arabic",sans-serif;quotes:none;margin-top:22px}
.pillar h3{font-size:1.1rem;margin-bottom:6px;color:var(--accent)}.pillar p{color:var(--muted);font-size:.93rem}
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px}
.ci{display:grid;gap:12px;margin:22px 0}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-tertiary);border-radius:12px;border:1px solid transparent}
a.row:hover{border-color:var(--accent)}.row .ic{color:var(--accent);width:1.4em;height:1.4em}.row small{display:block;color:var(--muted);line-height:1.3}.row b{font-weight:500;word-break:break-all}
.soon{opacity:.5}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
input,textarea{background:var(--bg-primary);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit}
input:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{min-height:130px;resize:vertical}
.err{color:#e08a7a;font-size:.82rem;min-height:1em}
footer{border-top:1px solid var(--line);padding:46px 0 calc(34px + var(--sab));background:var(--bg-secondary);text-align:center;color:var(--muted)}
footer q{display:block;color:var(--text);font-size:1.1rem;font-style:italic;quotes:none;margin-bottom:18px}
footer .chips{justify-content:center;margin:12px 0 22px}
footer a.chip:hover{border-color:var(--accent)}
.up{display:inline-flex;gap:8px;align-items:center;color:var(--accent);margin-bottom:22px}
.logo{width:42px;height:auto;display:block;filter:brightness(1.7)}.idcard .logo{width:130px;margin:0 auto 16px}.edu .logo{width:78px}
.icons{display:flex;flex-wrap:wrap;gap:12px}.ib{display:grid;place-items:center;min-width:56px;height:56px;padding:0 14px;border-radius:14px;background:var(--bg-tertiary);border:1px solid var(--line);color:var(--accent);transition:transform .15s,border-color .15s}.ib:hover{border-color:var(--accent);transform:translateY(-2px)}.ib svg{width:26px;height:26px}.ib.plat{height:62px;padding:0 18px}.ib.plat img{display:block;width:auto}.ib span{font-weight:700;color:var(--text);font-size:.95rem}
.crest{width:88px;height:auto;display:block}.cl{display:inline-flex;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px}.cl img{height:48px;width:auto;display:block}
.plan{display:flex;flex-direction:column;position:relative}.plan.hot{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--bg-card))}.pop{position:absolute;top:-12px;inset-inline-end:20px;background:var(--accent);color:#1a1209;font-size:.78rem;font-weight:700;padding:3px 12px;border-radius:999px}.plan h3{font-size:1.3rem}.tg{color:var(--muted);font-size:.9rem;margin:2px 0 16px}.pr b{font:800 2.4rem 'Bricolage Grotesque','IBM Plex Sans Arabic',sans-serif;color:var(--accent)}.pr small{color:var(--muted)}.dl{color:var(--muted);font-size:.85rem;margin:6px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.plan ul{list-style:none;padding:0;display:grid;gap:10px;margin-bottom:24px;flex:1;font-size:.92rem}.plan li{display:flex;gap:10px}.plan li .ic{color:var(--accent);margin-top:4px}.plan .btn{justify-content:center}
.tw{overflow-x:auto;margin-bottom:18px;border:1px solid var(--line);border-radius:16px}.ptab{width:100%;min-width:760px;border-collapse:collapse;background:var(--bg-card)}.ptab th,.ptab td{padding:16px 18px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}.ptab thead th{font-family:'Bricolage Grotesque','IBM Plex Sans Arabic',sans-serif;font-size:1.05rem;background:var(--bg-tertiary)}.ptab tbody th{font-weight:500;font-size:.95rem;width:26%}.ptab td b{display:block;color:var(--accent);font-size:1.15rem}.ptab td span{display:block;color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.5}.ptab .hot{background:var(--accent-soft)}.ptab tr:last-child>*{border-bottom:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tb{font:500 .92rem inherit;color:var(--muted);background:var(--bg-secondary);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.tb.on{background:var(--accent);color:#1a1209;border-color:var(--accent)}
.edu{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}.edu h3{font-size:1.4rem}.edu .org{color:var(--accent);margin:2px 0 12px;font-weight:500}.edu p{color:var(--muted);margin-bottom:10px}.edu h4{margin:18px 0 10px}
.cert .ic{color:var(--accent);width:2em;height:2em;margin-bottom:12px}.cert h3{font-size:1.1rem}.cert p{color:var(--muted);font-size:.92rem}.cert em{font-style:normal;font-size:.8rem;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:999px;display:inline-block;margin-top:10px}
.steps .card b{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--accent)}.steps h3{font-size:1.05rem;margin:6px 0}.steps p{color:var(--muted);font-size:.92rem}
.empty{text-align:center}.empty h3{font-size:1.2rem}.empty p{color:var(--muted);margin-top:6px}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;font-size:1.7rem;color:var(--bg-tertiary);cursor:pointer;padding:0 2px}.stars button.on{color:var(--accent)}
.who{max-width:680px;margin:0 auto 34px}.who h3{font-size:1.2rem;margin-bottom:8px}.who p{color:var(--muted)}
@media(max-width:900px){.hero .wrap,.about,.proj,.contact{grid-template-columns:1fr}.g3,.g2{grid-template-columns:1fr}.idcard{position:static}section{padding:70px 0}.photo{max-width:340px}.f0{inset-inline-start:-8px}.f1{inset-inline-end:-8px}.bar{flex-wrap:wrap;height:auto;padding:10px 0 4px;gap:8px}nav{order:3;width:100%;margin:0}.hero{padding-top:calc(150px + var(--sat))}.proj .body{padding:24px}.stats{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

[[10,b('Up to 5K rows, basic cleaning','لحد 5 آلاف صف، تنظيف أساسي')],[15,b('Up to 50K rows + outliers, encoding, scaling','لحد 50 ألف صف + القيم الشاذة والترميز والتحجيم')],[25,b('Large or multiple files, full documented pipeline','ملفات كبيرة أو متعددة، مسار كامل موثّق')]],
[[15,b('Key charts + short summary','رسوم رئيسية + ملخص مختصر')],[20,b('Correlations, patterns, 10+ charts','ارتباطات وأنماط، أكثر من 10 رسوم')],[35,b('Full profiling, insights report, recommendations','توصيف شامل، تقرير رؤى، توصيات')]],
[[10,b('Simple queries and filters','استعلامات وتصفية بسيطة')],[15,b('Multi-table joins, aggregation, views','ربط جداول وتجميع وViews')],[25,b('Complex queries, ready for analytics pipelines','استعلامات معقدة، جاهزة لمسارات التحليل')]],
[[20,b('One baseline model + basic metrics','نموذج واحد أساسي + مقاييس أساسية')],[30,b('One tuned model, F1/Precision/Recall, confusion matrix','نموذج واحد مضبوط، F1 وPrecision وRecall، مصفوفة الالتباس')],[55,b('3-4 models compared, tuning, imbalanced data, report','مقارنة 3-4 نماذج، ضبط، بيانات غير متوازنة، تقرير')]]]};
const PRT=()=>`<h3 style='font-size:1.5rem;margin:56px 0 6px'>${t(SP.title)}</h3><p class='lead' style='margin:0 0 24px'>${t(SP.sub)}</p><div class='tw'><table class='ptab'><thead><tr><th>${t(SP.svc)}</th>${PRICING.plans.map(x=>`<th class='${x.hot?'hot':''}'>${t(x.n)}</th>`).join('')}</tr></thead><tbody>${SP.rows.map((r,i)=>`<tr><th>${t(services.items[i].title)}</th>${r.map((c,j)=>`<td class='${PRICING.plans[j].hot?'hot':''}'><b dir='ltr'>${c[0]} ${t(PRICING.cur)}</b><span>${t(c[1])}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class='lead' style='margin:0 0 44px;font-size:.9rem'>${t(PRICING.note)}</p>`;
function render(){

 +'<div class="photo"><img src="'+PROFILE+'" alt="'+t(h.name)+'">'+h.floats.map((x,i)=>'<div class="float f'+i+'">'+ic(x.icon)+'<div><b>'+t(x.title)+'</b><small>'+t(x.sub)+'</small></div></div>').join('')+'</div></div></section>';
 H+='<section class="alt" id="about"><div class="wrap">'+head(a)+'<div class="about"><aside class="card idcard"><img class="logo" src="'+LOGO+'" alt=""><h3>'+t(a.photoName)+'</h3><p>'+t(a.photoSub)+'</p><div class="snaps">'+a.snapshots.map(x=>'<div class="snap">'+ic(x.icon)+'<div><b>'+t(x.v)+'</b><small>'+t(x.l)+'</small></div></div>').join('')+'</div></aside><div><h3 class="big">'+t(a.heading)+'</h3>'+a.paragraphs.map(x=>'<p>'+t(x)+'</p>').join('')+'<h4>'+t(a.focusTitle)+'</h4><ul class="focus">'+a.focus.map(x=>'<li>'+ic('check')+t(x)+'</li>').join('')+'</ul><blockquote><small>'+t(a.philosophyTitle)+'</small>'+t(a.philosophyQuote)+'</blockquote><h4>'+t(a.courseworkTitle)+'</h4>'+chips(a.coursework)+'</div></div></div></section>';
H+='<section id="education"><div class="wrap">'+head(X.education)+'<div class="card edu"><img class="crest" src="'+ZU+'" alt="Zagazig University"><div><h3>'+t(z.role)+'</h3><div class="org">'+t(z.org)+' · '+X.education.years+'</div><p>'+t(z.summary)+'</p><p>'+t(z.details)+'</p><h4>'+t(X.education.focusTitle)+'</h4>'+chips(z.tags)+'</div></div></div></section>';
H+='<section class="alt" id="certificates"><div class="wrap">'+head(X.certs)+'<div class="grid g3">'+X.certs.items.map(x=>'<div class="card cert">'+(x.img?'<span class="cl"><img src="'+x.img+'" alt=""></span>':ic('checkcircle'))+'<h3>'+t(x.t)+'</h3><p>'+t(x.o)+(x.d?' · '+x.d:'')+'</p>'+(x.soon?'<em>'+t(X.certs.soon)+'</em>':'')+'</div>').join('')+'</div></div></section>';
H+='<section id="skills"><div class="wrap">'+head(sk,sk.desc)+'<div class="tabs">'+TABS.map(k=>'<button class="tb'+(k[0]===tab?' on':'')+'" data-tab="'+k[0]+'" type="button">'+t(k[1])+'</button>').join('')+'</div><div class="grid g3">'+pick[tab].map(skc).join('')+'</div></div></section>';
 H+='<section id="projects"><div class="wrap">'+head(p,p.desc)+'<div class="grid">'+p.items.map(x=>'<article class="card proj"><img src="'+img(x.image)+'" alt="'+t(x.imageAlt)+'"><div class="body"><div class="meta"><span>'+t(x.cat)+'</span><em>'+t(x.status)+'</em></div><h3>'+t(x.title)+'</h3><p>'+t(x.desc)+'</p><div class="stats">'+x.stats.map(s=>'<div class="stat"><b dir="ltr">'+s.n+'</b><small>'+t(s.l)+'</small></div>').join('')+'</div><h4>'+t(x.modelsTitle)+'</h4>'+chips(x.models)+'<h4>'+t(x.stackTitle)+'</h4>'+chips(x.stack)+'<div class="insight"><b>'+t(x.insightTitle)+':</b> '+t(x.insight)+'</div><p class="learn"><b>'+t(x.learningTitle)+'</b> '+t(x.learning)+'</p></div></article>').join('')+'</div></div></section>';
 H+='<section class="alt" id="experience"><div class="wrap">'+head(X.exp,e.desc)+'<div class="tl">'+e.items.slice(0,2).map(x=>'<div class="card'+(x.active?' on':'')+'"><span class="bd">'+t(x.badge)+'</span><h3>'+t(x.role)+'</h3><div class="org">'+t(x.org)+'</div><p>'+t(x.summary)+'</p><p>'+t(x.details)+'</p>'+chips(x.tags)+'</div>').join('')+'</div></div></section>';
 H+='<section class="alt" id="services"><div class="wrap">'+head(sv,sv.desc)+'<div class="grid g2">'+sv.items.map(x=>'<div class="card svc">'+ic(x.icon)+'<h3>'+t(x.title)+'</h3><p>'+t(x.desc)+'</p><ul>'+x.bullets.map(b=>'<li>'+t(b)+'</li>').join('')+'</ul></div>').join('')+'</div>'+PRT()+'<div class="grid g3 steps" style="margin-top:20px">'+X.steps.map((x,i)=>'<div class="card"><b>0'+(i+1)+'</b><h3>'+t(x.t)+'</h3><p>'+t(x.d)+'</p></div>').join('')+'</div><p style="text-align:center;margin-top:34px"><a class="btn p" href="#contact">'+t(X.cta)+'</a></p></div></section>';
H+='<section id="testimonials"><div class="wrap">'+head(X.tm)+'<div class="card empty"><h3>'+t(X.tm.empty)+'</h3><p>'+t(X.tm.emptyD)+'</p></div><form class="card" id="tmf" novalidate style="margin-top:20px;max-width:640px"><h3>'+t(X.tm.leave)+'</h3><p class="lead" style="margin:-8px 0 0;font-size:.93rem">'+t(X.tm.sub)+'</p><div>'+t(X.tm.rate)+'<div class="stars" dir="ltr">'+[1,2,3,4,5].map(n=>'<button type="button" data-star="'+n+'" aria-label="'+n+'">★</button>').join('')+'</div></div><label>'+t(X.tm.name)+'<input name="n"></label><label>'+t(X.tm.msg)+'<textarea name="m"></textarea></label><button class="btn p" type="submit">'+t(X.tm.send)+'</button></form></div></section>';
 const r=(i,l,v,h,x)=>'<'+(h?'a href="'+h+'"'+(x?' target="_blank" rel="noopener"':''):'div')+' class="row'+(h?'':' soon')+'">'+ic(i)+'<div><small>'+l+'</small><b dir="ltr">'+v+'</b></div></'+(h?'a':'div')+'>';
 H+='<section class="alt" id="contact"><div class="wrap">'+head(c,c.desc)+'<div class="contact"><div class="card"><h3>'+t(c.infoTitle)+'</h3><p class="lead" style="font-size:.95rem">'+t(c.infoDesc)+'</p><div class="icons" style="margin-top:22px">'+ib('mail',t(c.email),'mailto:'+LINKS.email)+ib('wa',t(c.wa),LINKS.whatsapp)+ib('phone',LINKS.phone,'tel:'+LINKS.phone)+ib('li',t(c.linkedin),LINKS.linkedin)+'</div><h3 style="font-size:1rem;margin:28px 0 12px">'+t(c.socialTitle)+'</h3><div class="icons">'+plat()+'</div></div>'
 +'<form class="card" id="form" novalidate><h3>'+t(c.formTitle)+'</h3><p class="lead" style="margin:-8px 0 0;font-size:.93rem">'+t(c.formSub)+'</p>'+['name','email','subject','message'].map(k=>'<label>'+t(c.fields[k])+(k==='message'?'<textarea name="'+k+'"':'<input name="'+k+'" type="'+(k==='email'?'email':'text')+'"')+' placeholder="'+t(c.placeholders[k])+'">'+(k==='message'?'</textarea>':'')+'<span class="err" data-e="'+k+'"></span></label>').join('')+'<button class="btn p" type="submit">'+ic('send')+t(c.send)+'</button><div class="err" id="st"></div></form></div></div></section>';
 H+='<footer><div class="wrap"><div class="who"><h3>'+t(X.who.t)+'</h3><p>'+t(o.quote)+'</p></div><q>'+t(f.tagline)+'</q><a class="up" href="#hero">'+ic('up')+t(f.top)+'</a><div>'+t(f.platforms)+'</div><div class="icons" style="justify-content:center;margin:12px 0 22px">'+plat()+'</div><div>© 2026 '+t(h.name)+'. '+t(f.rights)+'</div><div style="font-size:.88rem;margin-top:6px">'+t(f.sub)+'</div></div></footer>';
 document.getElementById('app').innerHTML=H;
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;const y=scrollY;render();scrollTo(0,y)});
 const sts=document.querySelectorAll('[data-star]'),paint=()=>sts.forEach(b=>b.classList.toggle('on',+b.dataset.star<=rate));paint();
 sts.forEach(b=>b.onclick=()=>{rate=+b.dataset.star;paint()});
 document.getElementById('tmf').onsubmit=function(ev){ev.preventDefault();const d=new FormData(this),m=(d.get('m')||'').trim();if(!m)return;location.href='mailto:'+LINKS.email+'?subject='+encodeURIComponent('Testimonial ('+rate+'/5)')+'&body='+encodeURIComponent(m+'\n\n— '+(d.get('n')||''));};
 document.getElementById('form').onsubmit=function(ev){ev.preventDefault();const d=new FormData(this),bad=[];
  ['name','email','subject','message'].forEach(k=>{const v=(d.get(k)||'').trim(),ok=k==='email'?/^\S+@\S+\.\S+$/.test(v):!!v;this.querySelector('[data-e='+k+']').textContent=ok?'':t(c.errors[k]);if(!ok)bad.push(k)});
  if(bad.length)return;document.getElementById('st').textContent=t(c.opening);
  location.href='mailto:'+LINKS.email+'?subject='+encodeURIComponent(d.get('subject'))+'&body='+encodeURIComponent(d.get('message')+'\n\n— '+d.get('name')+' ('+d.get('email')+')');};
}
document.getElementById('lang').onclick=function(){const y=scrollY;L=L==='en'?'ar':'en';render();scrollTo(0,y)};
render();
})();
